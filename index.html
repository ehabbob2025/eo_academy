
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>حاسبة السعرات - إيهاب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #008cba;
            color: white;
            font-weight: bold;
        }
        .result {
            margin-top: 20px;
            background: #e6ffe6;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #b2d8b2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>حاسبة السعرات الحرارية - إيهاب</h2>
        <label>الوزن (كجم):</label>
        <input type="number" id="weight">

        <label>الطول (سم):</label>
        <input type="number" id="height">

        <label>العمر (بالسنوات):</label>
        <input type="number" id="age">

        <label>النوع:</label>
        <select id="gender">
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
        </select>

        <label>معدل النشاط:</label>
        <select id="activity">
            <option value="1.2">خامل (بدون نشاط)</option>
            <option value="1.375">نشاط خفيف (تمارين خفيفة 1-3 أيام)</option>
            <option value="1.55">نشاط متوسط (تمارين 3-5 أيام)</option>
            <option value="1.725">نشاط عالي (تمارين 6-7 أيام)</option>
            <option value="1.9">نشاط قوي جدًا (تمارين شديدة أو عمل بدني)</option>
        </select>

        <label>الهدف:</label>
        <select id="goal">
            <option value="lose">خسارة وزن</option>
            <option value="maintain">تثبيت وزن</option>
            <option value="gain">زيادة وزن</option>
        </select>

        <button onclick="calculateCalories()">احسب السعرات</button>

        <div class="result" id="result" style="display:none;"></div>
    </div>

    <script>
        function calculateCalories() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const age = parseFloat(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const activity = parseFloat(document.getElementById('activity').value);
            const goal = document.getElementById('goal').value;

            if (isNaN(weight) || isNaN(height) || isNaN(age)) {
                alert('من فضلك املأ كل البيانات بشكل صحيح.');
                return;
            }

            let bmr;
            if (gender === 'male') {
                bmr = 10 * weight + 6.25 * height - 5 * age + 5;
            } else {
                bmr = 10 * weight + 6.25 * height - 5 * age - 161;
            }

            let calories = bmr * activity;

            if (goal === 'lose') {
                calories -= 500;
            } else if (goal === 'gain') {
                calories += 500;
            }

            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `معدل السعرات اليومية التقريبي: <strong>${Math.round(calories)}</strong> سعرة حرارية.`;
        }
    </script>
</body>
</html>
